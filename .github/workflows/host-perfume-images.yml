name: Host perfume images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  host-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and host product images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import re, os, mimetypes, subprocess, urllib.request
          from pathlib import Path

          p = Path('script.js')
          text = p.read_text(encoding='utf-8')

          # Replace the two confirmed failing sources with stable product images.
          replacements = {
              'https://la.louisvuitton.com/images/is/image/lv/1/PP_VP_L/louis-vuitton-perfumes-imagination--LP0221_PM1_WornView.jpg': 'https://pl.louisvuitton.com/images/is/image/lv/1/PP_VP_L/louis-vuitton-imagination--LP0491_PM2_Front%20view.jpg',
              'https://www.yslbeauty.ca/dw/image/v2/BBTN_PRD/on/demandware.static/-/Sites-ysl-master-catalog/default/dw5c7e9c0a/WW-40701YSL/WW-40701YSL_1.jpg': 'https://shop.ethosprofumerielauda.com/cdn/shop/products/3365440787858.jpg?v=1781716451',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          pattern = re.compile(r'\{id:(\d+),.*?image:"([^"]+)"\}', re.S)
          matches = list(pattern.finditer(text))
          os.makedirs('images/perfumes', exist_ok=True)

          for product_id, url in matches:
              ext = '.jpg'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      data = r.read()
                      ctype = r.headers.get_content_type()
                      ext = mimetypes.guess_extension(ctype) or '.jpg'
                  if ext == '.jpe': ext = '.jpg'
                  filename = f'images/perfumes/{product_id}{ext}'
                  Path(filename).write_bytes(data)
                  text = text.replace(url, filename)
                  print(f'HOSTED {product_id}: {url} -> {filename}')
              except Exception as e:
                  print(f'FAILED {product_id}: {url} ({e})')

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit hosted images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js images/perfumes
          git commit -m "Host perfume bottle images locally" || exit 0
          git push

      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/host-perfume-images.yml
          git commit -m "Remove temporary image hosting workflow"
          git push
